<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>XSnap — 把一条推文排版成一张图</title>
  <meta name="description" content="贴一个 x.com 或 twitter.com 链接，得到一张干净、高清、可以直接发出去的图。引用、串推、多图都替你处理好。全部在浏览器里完成。">
  <meta name="theme-color" content="#1d3bff">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="XSnap">
  <meta property="og:title" content="XSnap — 把一条推文排版成一张图">
  <meta property="og:description" content="贴链接，出图。引用、串推、多图都替你处理好。">
  <meta property="og:url" content="https://maxlen727.github.io/XSnap/">
  <meta property="og:image" content="https://maxlen727.github.io/XSnap/assets/preview.jpg">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fxtwitter.com">
  <link rel="preconnect" href="https://pbs.twimg.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="frame" aria-hidden="true"></div>

<header class="masthead">
  <a class="brand" href="./">
    <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="2.5" y="2.5" width="35" height="35" fill="none"
            stroke="currentColor" stroke-width="2.6"/>
      <path d="M11.5 11.5 28.5 28.5M28.5 11.5 11.5 28.5" stroke="currentColor"
            stroke-width="2.6" stroke-linecap="square"/>
    </svg>
    <span class="brand__word">XSnap</span>
  </a>
  <p class="masthead__meta" data-i18n="masthead">贴链接 · 出图</p>
</header>

<div class="cols">

  <main class="main">

    <form class="composer" id="composer" autocomplete="off" novalidate>
      <label class="composer__label" for="tweet-url" data-i18n="urlLabel">链接</label>
      <div class="composer__field">
        <input id="tweet-url" type="text" inputmode="url" spellcheck="false" autocapitalize="off"
               data-i18n-placeholder="placeholder" placeholder="https://x.com/…">
        <button class="btn-snap" id="fetch-btn" type="submit">
          <span class="btn-snap__text" data-i18n="generate">生成</span>
          <span class="btn-snap__arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </form>

    <p class="composer__hint">
      <span data-i18n="hintSupports">支持 x.com / twitter.com · 引用 · 串推 · 多图</span>
      <button class="link-underline" id="example-btn" type="button" data-i18n="tryExample">试一个</button>
    </p>

    <div class="stage" id="stage">

      <div class="empty" id="empty">
        <p class="empty__num" aria-hidden="true">01</p>
        <h1 class="empty__title"><span data-i18n="emptyTitle1">把一条推文，</span><span data-i18n="emptyTitle2">排版成一张图。</span></h1>
        <p class="empty__note" data-i18n="emptyNote">上面的框里贴一个链接。图会出现在这里，可以直接下载，或者复制到剪贴板。</p>
      </div>

      <figure class="plate" id="plate" hidden>
        <div id="capture-area" class="capture"></div>
        <figcaption class="caption" id="caption"></figcaption>
      </figure>

    </div>
  </main>

  <aside class="rail" id="rail">

    <section class="group">
      <div class="group__head">
        <h2 data-i18n="bgStyle">背景</h2>
        <button class="mini" id="shuffle-bg" type="button" data-i18n="shuffle">换一批</button>
      </div>
      <div class="swatches" id="bg-swatches"></div>
      <div class="custom-colors" id="custom-bg" hidden>
        <label class="color-input">
          <input type="color" id="bg-color-1" value="#f4f1ea">
          <span data-i18n="from">起</span>
        </label>
        <label class="color-input">
          <input type="color" id="bg-color-2" value="#1d3bff">
          <span data-i18n="to">止</span>
        </label>
      </div>
    </section>

    <section class="group">
      <div class="group__head">
        <h2 data-i18n="cardStyle">卡片</h2>
      </div>
      <div class="swatches swatches--card" id="card-swatches"></div>
      <div class="custom-colors" id="custom-card" hidden>
        <label class="color-input color-input--wide">
          <input type="color" id="card-color-custom" value="#ffffff">
          <span data-i18n="cardColor">卡片颜色</span>
        </label>
      </div>
    </section>

    <section class="group">
      <h2 class="group__title" data-i18n="layout">多图布局</h2>
      <ul class="spec" id="layout-seg">
        <li><button type="button" data-value="grid" aria-pressed="true"><span data-i18n="grid">网格</span><i></i><b>●</b></button></li>
        <li><button type="button" data-value="waterfall" aria-pressed="false"><span data-i18n="waterfall">堆叠</span><i></i><b>○</b></button></li>
      </ul>
    </section>

    <section class="group">
      <h2 class="group__title" data-i18n="quality">导出质量</h2>
      <ul class="spec" id="quality-seg">
        <li><button type="button" data-value="2" aria-pressed="false"><span>2×</span><i></i><b>○</b></button></li>
        <li><button type="button" data-value="3" aria-pressed="true"><span>3×</span><i></i><b>●</b></button></li>
        <li><button type="button" data-value="4" aria-pressed="false"><span>4×</span><i></i><b>○</b></button></li>
      </ul>
    </section>

    <section class="group">
      <h2 class="group__title" data-i18n="options">选项</h2>
      <ul class="spec" id="opt-list">
        <li><label><span data-i18n="showStats">显示数据</span><i></i>
          <input type="checkbox" id="opt-stats" checked><b></b></label></li>
        <li><label><span data-i18n="showWatermark">显示水印</span><i></i>
          <input type="checkbox" id="opt-watermark" checked><b></b></label></li>
      </ul>
    </section>

    <section class="group group--actions">
      <button class="btn-solid" id="download-btn" type="button" data-i18n="download">下载 PNG</button>
      <button class="btn-line" id="copy-btn" type="button" data-i18n="copy">复制图片</button>
      <p class="group__foot" data-i18n="kbdHint">⌘/Ctrl + S 也能下载</p>
    </section>

  </aside>
</div>

<footer class="colophon">
  <span data-i18n="builtBy">由</span>
  <a href="https://github.com/maxlen727" target="_blank" rel="noopener">MaxLen</a>
  <span class="colophon__sep">·</span>
  <span data-i18n="poweredBy">数据来自</span>
  <a href="https://github.com/FxEmbed/FxEmbed" target="_blank" rel="noopener">FxEmbed</a>
  <span class="colophon__sep">·</span>
  <a href="https://github.com/maxlen727/XSnap" target="_blank" rel="noopener" data-i18n="source">源码</a>
</footer>

<div id="toast-container" class="toasts" role="status" aria-live="polite"></div>

<template id="tpl-card">
  <article class="card">
    <div class="card__context" hidden></div>

    <header class="card__head">
      <img class="card__avatar" alt="" loading="eager" decoding="async">
      <div class="card__who">
        <div class="card__line">
          <span class="card__name"></span>
          <span class="card__badge" hidden>
            <svg viewBox="0 0 22 22" aria-hidden="true"><path fill="#1d9bf0" d="M20.4 5.3 8.8 16.6a1.4 1.4 0 0 1-2 0L2.4 12.3a1.4 1.4 0 0 1 2-2l3.4 3.3L18.4 3.3a1.4 1.4 0 0 1 2 2z"/></svg>
          </span>
        </div>
        <div class="card__handle"></div>
      </div>
      <div class="card__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.1 8.1L23.2 22h-6.6l-5.2-6.8L5.5 22H2.4l7.6-8.7L1.4 2h6.8l4.7 6.2L18.9 2Zm-1.2 18h1.8L7.1 3.9H5.2L17.7 20Z"/></svg>
      </div>
    </header>

    <p class="card__text"></p>

    <div class="card__quote" hidden>
      <header class="card__quote-head">
        <img class="card__quote-avatar" alt="" loading="eager" decoding="async">
        <span class="card__quote-name"></span>
        <span class="card__quote-handle"></span>
      </header>
      <p class="card__quote-text"></p>
      <div class="card__quote-media"></div>
    </div>

    <div class="card__media"></div>

    <footer class="card__stats">
      <span class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg><b class="stat-replies"></b></span>
      <span class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 23-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><b class="stat-retweets"></b></span>
      <span class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.2l7.8-7.7 1.1-1.1a5.5 5.5 0 0 0 0-7.8Z"/></svg><b class="stat-likes"></b></span>
      <span class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg><b class="stat-views"></b></span>
    </footer>
  </article>
</template>

<script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js" crossorigin="anonymous"></script>
<script src="assets/i18n.js" defer></script>
<script src="assets/main.js" defer></script>
</body>
</html>
